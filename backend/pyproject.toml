[project]
name = "adaptive-ui-connector-backend"
version = "0.1.0"
description = "Policy checked UI connector orchestration API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2", "httpx>=0.27,<1", "PyJWT>=2.9,<3", "cryptography>=43,<46"
]
[project.optional-dependencies]
workers = ["playwright>=1.47,<2", "pywinauto>=0.6.8; platform_system == 'Windows'", "mss>=9", "opencv-python-headless>=4.10", "pytesseract>=0.3"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
[tool.ruff]
line-length = 100
